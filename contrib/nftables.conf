#!/usr/sbin/nft -f
#
# nftables part of mc-tarpit. Append this file to /etc/nftables.conf
# (or include it) and reload nftables:
#
#     cat contrib/nftables.conf >> /etc/nftables.conf
#     systemctl restart nftables
#
# Two sets are managed by mc_tarpit.py, the chain only drops their members.

table inet mc_tarpit {
	set tarpit {
		type ipv4_addr
		flags timeout
		timeout 1d
	}
	set pingsink {
		type ipv4_addr
		flags timeout
		timeout 15m
	}
	chain input {
		type filter hook input priority -50; policy accept;
		tcp dport 25565 ip saddr @tarpit counter drop
		tcp dport 25565 ip saddr @pingsink counter drop
	}
}
