#!/usr/sbin/nft -f
#
# nftables part of mc-tarpit. Append this file to /etc/nftables.conf
# (or include it) and reload nftables:
#
#     cat contrib/nftables.conf >> /etc/nftables.conf
#     systemctl restart nftables
#
# install.sh replaces the elements of `ports` with the configured ports.
# The sets are managed by mc_tarpit.py, the chain only drops their members.

table inet mc_tarpit {
	set ports {
		type inet_service
		elements = { 25565 }
	}
	set tarpit {
		type ipv4_addr
		flags timeout
		timeout 1d
	}
	set tarpit6 {
		type ipv6_addr
		flags timeout
		timeout 1d
	}
	set pingsink {
		type ipv4_addr
		flags timeout
		timeout 15m
	}
	set pingsink6 {
		type ipv6_addr
		flags timeout
		timeout 15m
	}
	chain input {
		type filter hook input priority -50; policy accept;
		tcp dport @ports ip saddr @tarpit counter drop
		tcp dport @ports ip saddr @pingsink counter drop
		tcp dport @ports ip6 saddr @tarpit6 counter drop
		tcp dport @ports ip6 saddr @pingsink6 counter drop
	}
}
