# /etc/mc-tarpit.conf - example configuration
#
# Every key can also be given as MC_TARPIT_<KEY> environment variable or as
# --<key> command line flag. Precedence: file < environment < command line.
# TTL values use nftables syntax: 30s, 15m, 1h, 1d, 7d.

[mc-tarpit]
# directory that contains whitelist.json and ops.json
server_dir = /home/mc/server

# ports to watch, comma separated
ports = 25565

# drop: really block offenders, log: only log what would happen
mode = drop

# sink: block status pings from IPs that are not trusted yet
# ignore: never act on pings, the server stays visible in server lists
ping_policy = sink

# tarpit: block IPs that try to log in with an unknown nickname
# log: only log them, leave the decision to the Minecraft whitelist
login_policy = tarpit

# how long an offender stays blocked
tarpit_ttl = 1d
ping_ttl = 15m

# how long an IP stays trusted after a login with a whitelisted nickname
trust_ttl = 2592000

# trusted IP list and extra nicknames, relative to server_dir
trust_file = tarpit-trusted.json
names_file = tarpit-names.txt

# subnets that are never blocked (LAN, proxies, admins), comma separated
trust_subnets = 192.168.0.0/24

# nftables table name (must match contrib/nftables.conf)
table = mc_tarpit

# capture interface, 'any' works on Linux
iface = any

# protocol version used by `ping` and `login` test clients
protocol = 776

# debug: log every decision, info: only actions, warn: only errors
log_level = info

# empty = stdout/journal, otherwise append lines to this file
log_file =
