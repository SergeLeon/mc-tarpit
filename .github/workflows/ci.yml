name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.7 is still the documented floor, but setup-python no longer ships
        # it for current runners; 3.9 is the oldest that is available.
        python-version: ['3.9', '3.12']
    name: python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python tests/test_parse.py
      - name: parser self-check
        run: python mc_tarpit.py selftest
