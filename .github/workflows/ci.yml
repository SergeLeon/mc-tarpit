name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.7 is still the documented floor, but setup-python no longer builds
        # it for any current runner. 3.9 is the oldest that still installs, and
        # only on ubuntu-22.04, hence the per-entry runner.
        include:
          - python-version: '3.9'
            os: ubuntu-22.04
          - python-version: '3.12'
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python tests/test_parse.py
      - name: parser self-check
        run: python mc_tarpit.py selftest
