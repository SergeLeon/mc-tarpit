name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: unit tests
        run: python tests/test_parse.py
      - name: parser self-check
        run: python mc_tarpit.py selftest
